[project]
name = "jeballto-cli"
version = "1.0.0b1"
description = "Modern CLI for the Jeballto VM Agent API"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
keywords = ["jeballto", "cli", "virtual-machine", "automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Systems Administration",
  "Topic :: Utilities",
]
dependencies = [
  "httpx>=0.28.1",
  "pyyaml>=6.0.2",
  "rich>=14.1.0",
  "typer>=0.16.1",
]

[project.urls]
Homepage = "https://github.com/jeballto/jeballto"
Repository = "https://github.com/jeballto/jeballto-cli-py"
Issues = "https://github.com/jeballto/jeballto/issues"

[project.scripts]
jeballto = "jeballto_cli.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.18.0",
  "pytest>=8.4.0",
  "pytest-cov>=7.0.0",
  "ruff>=0.13.0",
  "types-pyyaml>=6.0.12.20250915",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jeballto_cli"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
pretty = true
packages = ["jeballto_cli"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
